<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flor & Joel · Organizador</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f7f4ec;color:#3c4d36;font:16px system-ui}header,main{max-width:1000px;margin:auto;padding:16px}h1,h2{font-family:Georgia;font-weight:400}h1{font-size:36px}button{border:0;border-radius:11px;padding:10px 14px;background:#667d5a;color:white;font:inherit;cursor:pointer}button.alt{background:#e5eadf;color:#3d5137}button.active{background:#3f5e39}button:disabled{opacity:.45}input,select,textarea{padding:10px;border:1px solid #cbd3c2;border-radius:9px;font:inherit;width:100%;background:white}label{display:block;margin:10px 0}.card{background:#fff;border:1px solid #e1e3d8;border-radius:18px;padding:15px;margin:12px 0}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{overflow:auto}.muted{color:#797f73;font-size:13px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:12px;background:#eef1e8;border-radius:12px}.stat b{display:block;font-size:22px}.item{border-bottom:1px solid #eaeee5;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}.branch{padding:10px 10px 10px 14px;border:1px solid #e0e5d9;border-radius:12px;margin:9px 0}.child{margin-left:15px;border-left:2px solid #d8e0d0;padding-left:10px}.note{font-size:13px;color:#6e7967;white-space:pre-wrap;margin:7px 0}.money{overflow:auto}table{border-collapse:collapse;min-width:660px;width:100%}td,th{padding:9px;text-align:left;border-bottom:1px solid #e5e8df}dialog{border:0;border-radius:16px;padding:20px;width:min(95vw,480px);box-shadow:0 20px 80px #0006}dialog::backdrop{background:#0006}small{color:#777}#status{font-size:13px;min-height:16px}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script></head><body>
<header><small>27 DE NOVIEMBRE DE 2026 ♡</small><h1>Flor & Joel</h1><div class="muted">Nuestro organizador de boda</div></header>
<main><section id="loginBox" class="card"><h2>Acceso privado</h2><label>Correo<input id="mail" type="email"></label><label>Contraseña<input id="pass" type="password"></label><div class="actions"><button id="enter">Entrar</button><button class="alt" id="signup">Crear cuenta</button></div><p id="message" class="muted"></p></section>
<section id="app" hidden><div class="actions"><span id="who" class="muted" style="flex:1"></span><button class="alt" id="logout">Salir</button></div><nav class="tabs card" id="tabs"><button data-tab="arbol">Árbol</button><button data-tab="invitados">Invitados</button><button data-tab="plata">Presupuesto</button></nav><p id="status"></p><div id="screen"></div></section></main>
<dialog id="modal"><form id="form"><h2 id="modalTitle"></h2><div id="fields"></div><div class="actions"><button type="button" class="alt" id="cancel">Cancelar</button><button type="submit">Guardar</button></div></form></dialog>
<script>
const sb=window.supabase.createClient('https://fnvhvptbkyohhnwbyrwv.supabase.co','sb_publishable_wjUp4njAjaU6TeSDUvlRgg_2gL31ZzV');
const $=x=>document.querySelector(x), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ars=x=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(x)||0);
const uuid=()=> 'p'+Date.now()+Math.random().toString(36).slice(2);
let shared={nodes:[],guests:[]},finance={budget:1000000,expenses:[]},user=null,couple=false,tab='arbol',guestTab='Adulto',busy=false,stampS='',stampF='';
const isCouple=email=>['glione.bim@gmail.com','flormoreno107@gmail.com'].includes(String(email).toLowerCase());
$('#enter').onclick=()=>auth(false);$('#signup').onclick=()=>auth(true);$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function auth(signup){const email=$('#mail').value.trim(),password=$('#pass').value;if(!email||!password)return $('#message').textContent='Completá correo y contraseña';const {error}=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});$('#message').textContent=error?error.message:signup?'Revisá tu correo si te pide confirmación.':'Ingresando...';if(!error&&!signup)start();}
async function start(){const r=await sb.auth.getUser();user=r.data.user;if(!user)return;const m=await sb.from('wedding_members').select('email').eq('email',user.email.toLowerCase()).maybeSingle();if(!m.data){$('#message').textContent='Correo sin autorización';return}couple=isCouple(user.email);$('#loginBox').hidden=true;$('#app').hidden=false;$('#who').textContent=user.email;document.querySelector('[data-tab="plata"]').hidden=!couple;await load(true);setInterval(()=>{if(!busy)load(false)},8000);}
async function load(first){const q=await sb.from('wedding_shared').select('data,updated_at').eq('id',1).single();if(q.error){$('#status').textContent=q.error.message;return}if(first||q.data.updated_at!==stampS){shared=q.data.data;stampS=q.data.updated_at;}if(couple){const f=await sb.from('wedding_finance').select('data,updated_at').eq('id',1).single();if(!f.error&&(first||f.data.updated_at!==stampF)){finance=f.data.data;stampF=f.data.updated_at;}}if(!$('#modal').open)render();}
async function persist(kind){busy=true;$('#status').textContent='Guardando...';const table=kind==='finance'?'wedding_finance':'wedding_shared',payload=kind==='finance'?finance:shared;const r=await sb.from(table).update({data:payload,updated_at:new Date().toISOString()}).eq('id',1).select('updated_at').single();busy=false;if(r.error){$('#status').textContent='No se guardó: '+r.error.message;return false}if(kind==='finance')stampF=r.data.updated_at;else stampS=r.data.updated_at;$('#status').textContent='Guardado en la nube ✓';render();return true;}
function field(k,label,val='',type='text'){return '<label>'+label+'<input name="'+k+'" type="'+type+'" value="'+esc(val)+'"></label>'}
function select(k,label,choices,value){return '<label>'+label+'<select name="'+k+'">'+choices.map(x=>'<option value="'+esc(x)+'" '+(x===value?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label>'}
function edit(title,fields,handler){$('#modalTitle').textContent=title;$('#fields').innerHTML=fields;$('#form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);$('#modal').close();await handler(fd)};$('#modal').showModal();}
$('#cancel').onclick=()=>$('#modal').close();
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.className=b.dataset.tab===tab?'active':'alt');if(tab==='plata'&&!couple)tab='arbol';if(tab==='arbol')tree();else if(tab==='invitados')guests();else budget();}
function tree(){const all=shared.nodes||[];const souvenir=all.find(x=>x.id==='souvenir_type_2026');if(souvenir){souvenir.info='23 previstos · comprar 30 · Proveedor Melody · entrega en 15 días';}
const hide=new Set(['souvenir_qty_2026','souvenir_vendor_2026','souvenir_lead_2026']);const visible=all.filter(n=>!hide.has(n.id));
function branch(n,level=0){if(level>14)return '';const kids=visible.filter(x=>x.parent===n.id);const info=n.info?'<div class="note">'+esc(n.info)+'</div>':'';return '<div class="branch"><div class="actions" style="align-items:center"><input style="width:auto" type="checkbox" data-done="'+esc(n.id)+'" '+(n.done?'checked':'')+'><b style="flex:1">'+esc(n.name)+'</b><button class="alt" data-add="'+esc(n.id)+'">＋</button><button class="alt" data-edit="'+esc(n.id)+'">Editar</button></div>'+info+(kids.length?'<div class="child">'+kids.map(x=>branch(x,level+1)).join('')+'</div>':'')+'</div>'}
$('#screen').innerHTML='<div class="card"><div class="actions"><h2 style="flex:1">Organización</h2><button id="newNode">+ Agregar</button></div>'+visible.filter(x=>!x.parent).map(x=>branch(x)).join('')+'</div>';
$('#newNode').onclick=()=>nodeEditor(null,null);document.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>nodeEditor(null,x.dataset.add));document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>nodeEditor(x.dataset.edit,null));document.querySelectorAll('[data-done]').forEach(x=>x.onchange=async()=>{const n=shared.nodes.find(n=>n.id===x.dataset.done);n.done=x.checked;await persist('shared')});}
function nodeEditor(nid,parent){const n=(shared.nodes||[]).find(x=>x.id===nid)||{name:'',parent:parent||'',info:'',owner:'Ambos',done:false};const opts=['<option value="">Rama principal</option>'].concat(shared.nodes.filter(x=>x.id!==nid).map(x=>'<option value="'+esc(x.id)+'" '+(x.id===n.parent?'selected':'')+'>'+esc(x.name)+'</option>')).join('');edit(nid?'Editar ítem':'Agregar ítem',field('name','Nombre',n.name)+'<label>Dentro de<select name="parent">'+opts+'</select></label><label>Información (opcional)<textarea name="info">'+esc(n.info||'')+'</textarea></label>',async fd=>{const name=String(fd.get('name')).trim();if(!name)return;if(nid)Object.assign(n,{name,parent:fd.get('parent')||null,info:fd.get('info')});else shared.nodes.push({id:uuid(),name,parent:fd.get('parent')||null,info:fd.get('info'),done:false,owner:'Ambos'});await persist('shared')})}
function guests(){const all=shared.guests||[],group=all.filter(x=>(x.type==='Niño'?'Niño':'Adulto')===guestTab);$('#screen').innerHTML='<div class="card"><h2>Invitados · '+all.length+'</h2><div class="actions"><button class="'+(guestTab==='Adulto'?'active':'alt')+'" id="adult">Adultos ('+all.filter(x=>x.type!=='Niño').length+')</button><button class="'+(guestTab==='Niño'?'active':'alt')+'" id="kid">Niños ('+all.filter(x=>x.type==='Niño').length+')</button><button id="addGuest">+ Agregar invitado</button></div><p class="muted">Confirmados: '+all.filter(x=>x.status==='Confirmado').length+'</p>'+group.map(g=>'<div class="item"><div style="flex:1"><b>'+esc(g.name)+'</b><div><button class="alt" data-confirm="'+esc(g.id)+'">Confirmado: '+(g.status==='Confirmado'?'Sí':'No')+'</button></div></div><button class="alt" data-guest="'+esc(g.id)+'">Editar</button></div>').join('')+'</div>';$('#adult').onclick=()=>{guestTab='Adulto';render()};$('#kid').onclick=()=>{guestTab='Niño';render()};$('#addGuest').onclick=()=>guestEditor();document.querySelectorAll('[data-guest]').forEach(x=>x.onclick=()=>guestEditor(x.dataset.guest));document.querySelectorAll('[data-confirm]').forEach(x=>x.onclick=async()=>{const g=shared.guests.find(g=>g.id===x.dataset.confirm);g.status=g.status==='Confirmado'?'Pendiente':'Confirmado';await persist('shared')});}
function guestEditor(gid){const g=(shared.guests||[]).find(x=>x.id===gid)||{name:'',type:guestTab,status:'Confirmado'};edit(gid?'Editar invitado':'Agregar invitado',field('name','Nombre',g.name)+select('type','Grupo',['Adulto','Niño'],g.type)+select('status','Confirmación',['Confirmado','Pendiente'],g.status),async fd=>{const name=String(fd.get('name')).trim();if(!name)return;const x={name,type:fd.get('type'),status:fd.get('status')};if(gid)Object.assign(g,x);else shared.guests.push({id:uuid(),...x});guestTab=x.type;await persist('shared')})}
function budget(){const e=finance.expenses||[],estimate=e.reduce((a,x)=>a+(+x.amount||0),0),actual=e.reduce((a,x)=>a+(+x.actual||0),0),paid=e.reduce((a,x)=>a+(+x.paid||0),0);$('#screen').innerHTML='<div class="stats"><div class="stat">Límite <b>'+ars(finance.budget)+'</b></div><div class="stat">Presupuestado <b>'+ars(estimate)+'</b></div><div class="stat">Costos reales <b>'+ars(actual)+'</b></div><div class="stat">Pagado <b>'+ars(paid)+'</b></div></div><div class="card"><div class="actions"><h2 style="flex:1">Hoja de presupuesto</h2><button id="addExpense">+ Rubro</button><button id="editLimit" class="alt">Editar límite</button></div><div class="money"><table><thead><tr><th>Rubro</th><th>Presupuestado</th><th>Costo real</th><th>Pagado</th><th></th></tr></thead><tbody>'+e.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+ars(x.amount)+'</td><td>'+ars(x.actual)+'</td><td>'+ars(x.paid)+'</td><td><button class="alt" data-exp="'+esc(x.id)+'">Editar</button></td></tr>').join('')+'</tbody></table></div><p class="muted">Saldo de costos reales sin pagar: '+ars(Math.max(0,actual-paid))+'</p></div>';$('#addExpense').onclick=()=>expenseEditor();$('#editLimit').onclick=()=>edit('Límite del presupuesto',field('budget','Monto máximo',finance.budget,'number'),async fd=>{finance.budget=Number(fd.get('budget'))||0;await persist('finance')});document.querySelectorAll('[data-exp]').forEach(x=>x.onclick=()=>expenseEditor(x.dataset.exp));}
function expenseEditor(eid){const x=(finance.expenses||[]).find(y=>y.id===eid)||{name:'',category:'Otros',amount:0,actual:0,paid:0};edit('Rubro del presupuesto',field('name','Concepto',x.name)+field('category','Categoría',x.category)+field('amount','Presupuestado $',x.amount,'number')+field('actual','Costo real $',x.actual||0,'number')+field('paid','Pagado $',x.paid||0,'number'),async fd=>{const v={name:String(fd.get('name')).trim(),category:fd.get('category'),amount:Number(fd.get('amount'))||0,actual:Number(fd.get('actual'))||0,paid:Number(fd.get('paid'))||0};if(!v.name)return;if(eid)Object.assign(x,v);else finance.expenses.push({id:uuid(),...v});await persist('finance')})}
sb.auth.getSession().then(({data})=>{if(data.session)start()});
</script></body></html>
